name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Manifest & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate agent guide and tracked files
        run: |
          python3 - <<'PY'
          import pathlib

          agents = pathlib.Path("AGENTS.md")
          assert agents.is_file() and agents.read_text(encoding="utf-8").strip(), "AGENTS.md missing or empty"
          assert not pathlib.Path(".ws-publish/manifest.json").exists(), "retired .ws-publish/manifest.json still present"
          print("Verified AGENTS.md and retired manifest absence.")
          PY
